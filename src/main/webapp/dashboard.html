<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Sunrise Dental Clinic</title>

    <link rel="stylesheet"
          href="assets/css/style.css">
</head>

<body>

<main class="dashboard-card">

    <div class="dashboard-header">
        <div>
            <p class="label">
                Sunrise Dental Clinic
            </p>

            <h1>Dashboard</h1>
        </div>

        <button id="logoutButton"
                class="secondary-button">
            Logout
        </button>
    </div>

    <p>
        Welcome,
        <strong id="fullName">Loading...</strong>
    </p>

    <p>
        Username:
        <span id="username">-</span>
    </p>

    <p>
        Role:
        <span id="role">-</span>
    </p>

    <div class="dashboard-actions">
        <a href="patients.html"
           class="primary-link">
            Manage Patients
        </a>

        <a href="appointments.html"
           class="primary-link">
            Manage Appointments
        </a>

        <a href="billing.html"
           class="primary-link">
            Manage Billing
        </a>

        <a id="treatmentLink"
           href="treatments.html"
           class="primary-link">
            Manage Treatments
        </a>

    </div>

    <div class="success-box">
        Authentication and session management are working.
    </div>

</main>

<script src="assets/js/dashboard.js"></script>
</body>
</html>
